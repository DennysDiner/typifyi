    category: gbe
    schedule: tier1

  - id: tasnetworks
    name: TasNetworks news
    type: page_diff
    url: https://www.tasnetworks.com.au/news
    link_include: ["/news"]
    tier: 1
    category: gbe
    schedule: tier1

  - id: stt
    name: Sustainable Timber Tasmania news
    type: page_diff
    url: https://www.sttas.com.au/news-views
    link_include: ["/news"]
    tier: 1
    category: gbe
    schedule: tier1

  - id: tasports
    name: TasPorts media
    type: page_diff
    url: https://www.tasports.com.au/media
    link_include: ["/media", "/news"]
    tier: 1
    category: gbe
