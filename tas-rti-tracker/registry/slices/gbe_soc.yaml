# Slice (b): Tasmanian Government Business Enterprises (GBE Act 1995), State-owned companies (SOCs)
# and separately captured subsidiaries / edge-case bodies, for the RTI Act 2009 (Tas) registry.
#
# EVIDENCE NOTES (read before relying on this file)
# - Network: all *.tas.gov.au, hydro.com.au, tasnetworks.com.au, abc.net.au etc. are egress-blocked.
#   The ONLY evidence is WebSearch output. That tool returns result titles + URLs + a short
#   model-written summary of the result pages (not raw page text). "snippet_verified" below means the
#   fact or URL appeared in that WebSearch output (URLs verbatim in the result list). Facts taken only
#   from the summary text are tagged "snippet_verified (search summary)"; treat them as weaker than a URL.
# - Search budget: the session-wide WebSearch cap (200) was hit after 34 successful searches in this
#   slice (the target was 50+). Searches NOT run because of this are listed at the bottom under
#   "queries_not_run". Everything not seen in a result is tagged memory or inferred.
# - Statutory basis for the whole slice (RTI Act 2009 s 5, "public authority"):
#   snippet_verified (search summary; result URL
#   https://www8.austlii.edu.au/cgi-bin/viewdoc/au/legis/tas/consol_act/rtia2009234/s5.html):
#   the s 5 definition of "public authority" includes "a Government Business Enterprise within the meaning of
#   the Government Business Enterprises Act 1995", "a State-owned company" and "a council-owned company".
#   The paragraph letters of those limbs and the exact wording of the "State-owned company" definition were
#   NOT seen -> UNCERTAIN. Whether a wholly-owned subsidiary of a GBE/SOC (e.g. Momentum Energy) meets the
#   "State-owned company" definition was NOT seen -> UNCERTAIN.
# - Carve-outs: s 6(1) excludes information held by listed persons/bodies (Governor, courts, tribunals,
#   Integrity Commission, Ombudsman, Auditor-General, DPP, Solicitor-General, etc.) unless it relates to
#   administration; a search summary stated Tascorp and MAIB are NOT in the s 6(1) list and no GBE/SOC was
#   named among the 17 excluded bodies (snippet_verified, search summary; weak - list not seen in full).
#   Commercial protection for GBEs/SOCs is via the s 38 exemption ("information relating to business affairs
#   of public authority" - competitive disadvantage for a public authority engaged in trade or commerce)
#   (snippet_verified, search summary; result URL
#   https://www.ombudsman.tas.gov.au/right-to-information/reasons-for-decisions/reasons-for-decisions-folder-2016-current/section-37-business-affairs-of-a-third-party).
#   That is an exemption, not an exclusion, so it does not change rti_status.
# - Disclosure logs: a March 2026 House of Assembly motion asked GBEs/SOCs to set up RTI disclosure logs; the
#   Premier wrote to GBEs/SOCs in mid-April 2026 asking them to publish RTI releases within 48 hours. ABC
#   (2026-05-20, https://www.abc.net.au/news/2026-05-20/tas-government-businesses-defy-premier/106700726)
#   reported: "TasTAFE, Hydro and Sustainable Timbers Tasmania were publishing disclosure logs, while TasRacing,
#   Aurora Energy and the Public Trustee would set them up - the other nine did not respond"; the Premier asked
#   Justice to draft RTI Act amendments compelling GBEs to keep a log. The same summary says the statutory
#   requirement to keep a public disclosure register applies to departments but "does not apply to Government
#   Business Enterprises or state-owned companies" (all snippet_verified, search summary). The names of "the
#   other nine" were NOT seen individually.
# - Government Business Governance Reforms Bill 2026 (second tranche) is in progress (Treasury page
#   https://www.treasury.tas.gov.au/government-businesses/government-business-governance-reform/government-business-governance-reforms-bill-2026,
#   snippet_verified URL). Search summary did not show any RTI content in it.
# - Privatisation review (May 2025, then-Treasurer Barnett; snippet_verified search summary, Pulse Tasmania):
#   retained = PAHSMA, Tascorp, Tasracing, TasRail, Entura, Public Trustee, TT-Line, Hydro Tasmania;
#   still under assessment = STT, MAIB, Aurora Energy, Metro Tasmania, Tasmanian Irrigation, TasNetworks, TasPorts.
#   A sale would change rti_status; re-check each record for "active".
#
# DEFERRED / NOT RECORDED HERE (to avoid duplicating slice a) - none of these were checked by search:
# - Homes Tasmania: statutory authority (Homes Tasmania Act 2022) - not a GBE (memory). Leave to slice a.
# - Macquarie Point Development Corporation: statutory authority under Macquarie Point Development Corporation
#   Act 2012, not listed in GBE Act Sch 1 (memory). Not in the Treasury GBE/SOC lists seen this session
#   (snippet_verified negative, weak). Leave to slice a.
# - Stadiums Tasmania: statutory authority under Stadiums Tasmania Act 2022 (memory); not in the Treasury lists
#   seen. Leave to slice a.
# - ReCFIT (Renewables, Climate and Future Industries Tasmania): a division of the Department of State Growth
#   (memory); covered by State Growth's RTI arrangements in slice a.
# - "Tasmanian Development and Resources": no current body of this name is known (memory); the Tasmanian
#   Development Authority / Tasmanian Development Board are statutory, not GBEs. Not searched.
# - "Tasmanian Energy": no current GBE/SOC of this name known (memory). Not searched.
# - TasTAFE: named in the ABC disclosure-log story alongside GBEs, but it is a statutory authority
#   (TasTAFE (Skills and Training Business) Act 2021, memory). Leave to slice a.

