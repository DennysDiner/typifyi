[project]
name = "tas-rti-tracker"
version = "0.1.0"
description = "Monitoring and tracking system for Tasmania's Right to Information regime"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pypdf>=4.0",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "holidays==0.105",   # pinned: an upgrade can silently change computed deadlines (audit #51)
  "click>=8.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "anthropic>=0.40",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "types-python-dateutil"]
web = ["datasette>=0.65"]
ocr = ["ocrmypdf>=16.0"]

[project.scripts]
rti = "rti_tracker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rti_tracker*"]

[tool.setuptools.package-data]
rti_tracker = ["migrations/*.sql", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
