title: Tas RTI tracker — data (private)
description: Faceted search over the RTI tracker store. Run with `datasette data/rti.db -m rti_tracker/web/datasette_metadata.yaml`.
# Private data (Kurt's applications and anything derived from them) is DENIED, not merely hidden (audit #54),
# and arbitrary SQL is off so the denial cannot be bypassed with a query. Serve on localhost only.
allow_sql: false
databases:
  rti:
    tables:
      items:
        facets: [authority_id, status, published_date]
        sort_desc: first_seen_at
      documents:
        facets: [authority_id, content_type, extraction_method]
      document_metadata:
        facets: [field, verified]
      changes:
        facets: [kind, severity, authority_id]
        sort_desc: detected_at
      authorities:
        facets: [type, rti_status, tier, disclosure_log_format]
      applications: {allow: false, hidden: true}      # Kurt's applications are never exposed via Datasette
      application_events: {allow: false, hidden: true}
      application_attachments: {allow: false, hidden: true}
      application_links: {allow: false, hidden: true}
      deadline_alerts_sent: {allow: false, hidden: true}
      alerts: {allow: false, hidden: true}            # alert payloads name Kurt's applications
      kv: {allow: false, hidden: true}
    queries:
      releases_by_authority_month:
        sql: SELECT authority_id, substr(COALESCE(published_date, first_seen_at),1,7) AS month, count(*) AS n FROM items GROUP BY 1,2 ORDER BY 2 DESC
      exemptions_cited:
        sql: SELECT d.authority_id, m.value AS exemptions, count(*) AS n FROM document_metadata m JOIN documents d ON d.id=m.document_id WHERE m.field='exemptions_cited' AND m.verified=1 GROUP BY 1,2 ORDER BY 3 DESC
      removals:
        sql: SELECT * FROM changes WHERE kind IN ('item_removed','item_edited','document_changed') ORDER BY detected_at DESC
